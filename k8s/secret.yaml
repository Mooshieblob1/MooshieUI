# Admin credentials - required on first run (users cannot self-register).
# You MUST set a real password before deploying. The server refuses to create
# the admin account if the password is empty or equals "changeme".
#
# Recommended: create the secret imperatively (never commit real passwords):
#   kubectl -n mooshieui create secret generic mooshieui-admin \
#     --from-literal=username=admin \
#     --from-literal=password=YOUR_STRONG_PASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: mooshieui-admin
  namespace: mooshieui
type: Opaque
data:
  # echo -n 'admin' | base64
  username: YWRtaW4=
  # Replace with: echo -n 'YOUR_STRONG_PASSWORD' | base64
  # The placeholder below is intentionally invalid - it will not be accepted.
  password: UkVQTEFDRV9NRQ==
---
# Cloudflare Tunnel token (optional — remove if not using cloudflared sidecar).
#   kubectl -n mooshieui create secret generic cloudflare-tunnel \
#     --from-literal=token=YOUR_TUNNEL_TOKEN
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel
  namespace: mooshieui
type: Opaque
data:
  # echo -n 'YOUR_TOKEN' | base64
  token: ""
