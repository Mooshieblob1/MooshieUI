services:
  mooshieui:
    build: .
    image: ghcr.io/mooshieblob1/mooshieui:latest
    ports:
      - "${MOOSHIEUI_PORT:-3200}:3200"
    # The container runs as uid/gid 10001: a host models directory must be
    # writable by it (sudo chown -R 10001:10001 ./models).
    volumes:
      - mooshie-data:/data
      - ${MODELS_PATH:-./models}:/data/models
    environment:
      - MOOSHIEUI_DATA_DIR=/data
      - MOOSHIEUI_ADMIN_USER=${MOOSHIEUI_ADMIN_USER:-admin}
      - MOOSHIEUI_ADMIN_PASS=${MOOSHIEUI_ADMIN_PASS:-changeme}
      - NVIDIA_VISIBLE_DEVICES=all
      - RUST_LOG=${RUST_LOG:-info}
      - MOOSHIEUI_TRUST_LOCALHOST=${MOOSHIEUI_TRUST_LOCALHOST:-true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Optional: Cloudflare Tunnel sidecar for secure remote access.
  # Uncomment and set CLOUDFLARE_TUNNEL_TOKEN in .env to enable.
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   network_mode: "service:mooshieui"
  #   restart: unless-stopped

volumes:
  mooshie-data:
