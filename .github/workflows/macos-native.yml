name: macOS Native Validation

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'comfyui-nodes/**'
      - 'package*.json'
      - 'scripts/macos/**'
      - 'scripts/comfyui-compat/**'
      - 'scripts/*artifacts.py'
      - '.github/tauri-no-updater-artifacts.json'
      - '.github/workflows/macos-native.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Apple Silicon build and runtime
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      APPLE_SIGNING_IDENTITY: '-'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/macos-runtime/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          key: macos-native
          cache-on-failure: true
      # --ignore-scripts: no dependency lifecycle script runs in CI, as in
      # release.yml and the Dockerfile (esbuild's platform binary comes from its
      # optional dependency; fsevents' install script is not needed to build).
      - name: Frontend checks
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run check:i18n
          npx svelte-check --output machine > svelte-check.txt 2>&1 || true
          # Existing type debt is reported; PR Guardrails separately blocks new errors.
          tail -n 1 svelte-check.txt
          python3 -m unittest discover -s scripts -p 'test_*artifacts.py'
      - name: Verify release version
        if: ${{ inputs.release }}
        env:
          RELEASE_TAG: ${{ inputs.source_ref }}
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"
      - name: Native Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target aarch64-apple-darwin --features tauri/custom-protocol
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --release --target aarch64-apple-darwin --features tauri/custom-protocol
      # Candidate and release builds are the same build: the updater signing key
      # never enters this job (see release.yml, sign-updaters). createUpdaterArtifacts
      # is off, so for a release the updater archive `tauri build` would have made
      # is created in the next step and signed by release.yml afterwards.
      - name: Build DMG
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config .github/tauri-no-updater-artifacts.json
      - name: Create updater archive
        if: ${{ inputs.release }}
        run: python3 scripts/updater_artifacts.py macos-archive --bundle-dir src-tauri/target/aarch64-apple-darwin/release/bundle
      - name: Verify app and disk image
        run: python3 scripts/macos/verify_bundle.py --bundle-dir src-tauri/target/aarch64-apple-darwin/release/bundle --output-dir macos-reports
      - name: Install the native managed runtime and check nodes
        run: |
          mkdir -p macos-runtime/bin
          # Same pinned uv release and SHA-256 as UV_VERSION/UV_ASSETS in src-tauri/src/setup.rs.
          curl --fail --location --retry 3 https://github.com/astral-sh/uv/releases/download/0.12.19/uv-aarch64-apple-darwin.tar.gz -o macos-runtime/uv.tar.gz
          echo "a9a8df1eedeb192f2e47e40e2faabfb387db4b850209118786d42f89dde3e0ba  macos-runtime/uv.tar.gz" | shasum -a 256 -c -
          tar -xzf macos-runtime/uv.tar.gz --strip-components=1 -C macos-runtime/bin
          python3 scripts/macos/setup_runtime.py --uv "$PWD/macos-runtime/bin/uv" --work-dir "$PWD/macos-runtime"
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.release && 'artifacts-aarch64-apple-darwin' || 'macos-candidate' }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
            macos-reports/
            macos-runtime/runtime-report.json
            macos-runtime/node-summary.json
            macos-runtime/requirements-resolved.txt
            macos-runtime/ComfyUI-*/comfyui-smoke.log
            svelte-check.txt
          if-no-files-found: error
      - name: Validation scope
        if: always()
        run: |
          echo '### Apple Silicon candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build, signature, runtime and node checks are automated. Finder/Gatekeeper, real model generation on MPS, and in-app update testing must pass on a physical Mac before enabling MACOS_RELEASE_ENABLED.' >> "$GITHUB_STEP_SUMMARY"
