name: Dependency Audit

# Runs the same advisory audit the release build runs (scripts/audit-deps.sh).
# Release builds fail on a vulnerability that was published after the last
# PR merged, so this also runs on main and once a day: a red run here means the
# next tag would fail, and the fix (usually a `cargo update -p` or a Dependabot
# PR) should land before tagging.

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'scripts/audit-deps.sh'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'scripts/audit-deps.sh'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    # Daily 05:00 UTC.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (npm + cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      # Monthly key so cargo-audit itself stays current.
      - name: Cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.month.outputs.month }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # npm audit and cargo audit read only the lockfiles, so nothing is
      # installed or built.
      - name: Audit dependencies
        run: bash scripts/audit-deps.sh
