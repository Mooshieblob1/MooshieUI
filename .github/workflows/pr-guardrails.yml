name: PR Guardrails

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails (build, i18n, types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base for diffing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: i18n parity
        run: node scripts/check-i18n-parity.mjs

      - name: Modals portaled app-wide
        run: node scripts/check-portals.mjs

      # Node 20 cannot load .ts directly, so the test is bundled with the
      # esbuild Vite already installs.
      - name: Content safety tests
        run: |
          npx esbuild scripts/tests/contentSafety.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/contentSafety.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/contentSafety.test.mjs"

      - name: LoRA trigger text tests
        run: |
          npx esbuild scripts/tests/loraTriggerText.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/loraTriggerText.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/loraTriggerText.test.mjs"

      - name: NovelAI outfit isolation tests
        run: |
          npx esbuild scripts/tests/naiOutfits.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/naiOutfits.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/naiOutfits.test.mjs"

      - name: Prompt spellcheck tests
        run: |
          npx esbuild scripts/tests/promptSpellcheck.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptSpellcheck.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptSpellcheck.test.mjs"

      - name: Image Info field order tests
        run: |
          npx esbuild scripts/tests/imageInfoFields.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/imageInfoFields.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/imageInfoFields.test.mjs"

      - name: Wildcard file tests
        run: |
          npx esbuild scripts/tests/wildcards.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/wildcards.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/wildcards.test.mjs"
      - name: Prompt comment and find tests
        run: |
          npx esbuild scripts/tests/promptComments.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptComments.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptComments.test.mjs"
      - name: Prompt tag merge tests
        run: |
          npx esbuild scripts/tests/promptMerge.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptMerge.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptMerge.test.mjs"
      - name: Outpaint canvas tests
        run: |
          npx esbuild scripts/tests/outpaintCanvas.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/outpaintCanvas.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/outpaintCanvas.test.mjs"
      - name: Prompt tag weight syntax tests
        run: |
          npx esbuild scripts/tests/promptTagAffixes.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptTagAffixes.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptTagAffixes.test.mjs"
      - name: Related tag helpers test
        run: |
          npx esbuild scripts/tests/relatedTags.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/relatedTags.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/relatedTags.test.mjs"
      - name: Character extract grounding tests
        run: |
          npx esbuild scripts/tests/characterExtract.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/characterExtract.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/characterExtract.test.mjs"
      - name: Prompt assistant model fit tests
        run: |
          npx esbuild scripts/tests/llmFit.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/llmFit.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/llmFit.test.mjs"

      - name: Comic layout tests
        run: |
          npx esbuild scripts/tests/comicLayout.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/comicLayout.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/comicLayout.test.mjs"

      - name: Comic export tests
        run: |
          npx esbuild scripts/tests/comicExport.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/comicExport.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/comicExport.test.mjs"

      - name: Comic vector bubble tests
        run: |
          npx esbuild scripts/tests/comicBubbles.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/comicBubbles.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/comicBubbles.test.mjs"

      - name: Enhance chat reply split tests
        run: |
          npx esbuild scripts/tests/enhanceChat.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/enhanceChat.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/enhanceChat.test.mjs"

      - name: NovelAI layout cleanup tests
        run: |
          npx esbuild scripts/tests/naiLayout.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/naiLayout.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/naiLayout.test.mjs"

      - name: Gallery grid windowing and selection tests
        run: |
          npx esbuild scripts/tests/galleryGrid.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/galleryGrid.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/galleryGrid.test.mjs"

      - name: Gallery character detection tests
        run: |
          npx esbuild scripts/tests/galleryCharacters.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/galleryCharacters.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/galleryCharacters.test.mjs"

      - name: Portrait character box tests
        run: |
          npx esbuild scripts/tests/portraitCharacterBox.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/portraitCharacterBox.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/portraitCharacterBox.test.mjs"

      - name: Image editor logic tests
        run: |
          npx esbuild scripts/tests/imageEditorOps.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/imageEditorOps.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/imageEditorOps.test.mjs"

      - name: Sample character tests
        run: |
          npx esbuild scripts/tests/sampleCharacters.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/sampleCharacters.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/sampleCharacters.test.mjs"

      - name: Gallery tagger scan tests
        run: |
          npx esbuild scripts/tests/galleryTagCache.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/galleryTagCache.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/galleryTagCache.test.mjs"

      - name: Skill notes cache tests
        run: |
          npx esbuild scripts/tests/skillNotes.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/skillNotes.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/skillNotes.test.mjs"

      - name: Prompt clickable range tests
        run: |
          npx esbuild scripts/tests/promptClickableRanges.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptClickableRanges.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptClickableRanges.test.mjs"

      - name: Prompt weight syntax tests
        run: |
          npx esbuild scripts/tests/promptWeightSyntax.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptWeightSyntax.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptWeightSyntax.test.mjs"

      - name: Split model VAE tests
        run: |
          npx esbuild scripts/tests/splitVae.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/splitVae.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/splitVae.test.mjs"

      - name: Model architecture registry tests
        run: |
          npx esbuild scripts/tests/architectures.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/architectures.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/architectures.test.mjs"

      - name: Wan image model tests
        run: |
          npx esbuild scripts/tests/wanModels.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/wanModels.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/wanModels.test.mjs"

      - name: Moody Moss Mix detection tests
        run: |
          npx esbuild scripts/tests/moodyMoss.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/moodyMoss.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/moodyMoss.test.mjs"

      - name: External link tests
        run: |
          npx esbuild scripts/tests/externalLink.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/externalLink.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/externalLink.test.mjs"

      - name: PNG metadata reader tests
        run: |
          npx esbuild scripts/tests/pngMetadata.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/pngMetadata.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/pngMetadata.test.mjs"

      - name: Stable Cascade stage B picker tests
        run: |
          npx esbuild scripts/tests/cascade.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/cascade.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/cascade.test.mjs"

      - name: Character memory budget and review tests
        run: |
          npx esbuild scripts/tests/characterMemory.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/characterMemory.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/characterMemory.test.mjs"

      - name: NAI V5 prompt cache split tests
        run: |
          npx esbuild scripts/tests/naiPromptCache.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/naiPromptCache.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/naiPromptCache.test.mjs"

      - name: Segment detail parser tests
        run: |
          npx esbuild scripts/tests/promptSegmentDetail.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptSegmentDetail.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptSegmentDetail.test.mjs"

      - name: Aspect dimension bucket tests
        run: |
          npx esbuild scripts/tests/aspectDimensions.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/aspectDimensions.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/aspectDimensions.test.mjs"

      - name: Prompt quality strip tests
        run: |
          npx esbuild scripts/tests/promptQualityStrip.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/promptQualityStrip.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/promptQualityStrip.test.mjs"

      - name: Changelog release notes tests
        run: |
          npx esbuild scripts/tests/changelog.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/changelog.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/changelog.test.mjs"

      - name: Auto-updater helper tests
        run: |
          npx esbuild scripts/tests/updater.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/updater.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/updater.test.mjs"

      - name: Backup merge tests
        run: |
          npx esbuild scripts/tests/backupMerge.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/backupMerge.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/backupMerge.test.mjs"

      - name: Keyboard shortcuts tests
        run: |
          npx esbuild scripts/tests/shortcuts.test.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/shortcuts.test.mjs" --log-level=warning
          node --test "$RUNNER_TEMP/shortcuts.test.mjs"

      - name: Release artifact checks
        run: python3 -m unittest discover -s scripts -p test_release_artifacts.py

      # main has no svelte-check errors, so any error fails the PR, including one
      # in a file the PR didn't touch (e.g. a .ts type change that breaks a
      # .svelte consumer). Warnings (a11y included) stay advisory.
      - name: svelte-check (blocking on errors)
        run: npm run check:types -- --threshold error

  a11y-advisory:
    name: a11y advisory (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base for diffing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Compute changed files
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt

      - name: svelte-check a11y -> job summary
        run: |
          npx svelte-check --output machine > sc.txt 2>&1 || true
          node scripts/svelte-check-diff.mjs --machine sc.txt --changed changed.txt --summary a11y.md || true
          cat a11y.md >> "$GITHUB_STEP_SUMMARY" || true
