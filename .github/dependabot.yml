version: 2
# Minor and patch bumps come as one weekly PR per ecosystem, so a main merge
# rebases three PRs instead of a dozen (each one starts CI). Majors and
# security updates still arrive as their own PRs.
updates:
  # Bump pinned GitHub Actions SHAs automatically.
  # Dependabot understands the "@SHA # tag" comment format and updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "Mooshieblob1"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Bump npm dependencies (package-lock.json at repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "Mooshieblob1"
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Bump Cargo dependencies (Cargo.toml lives in src-tauri/, not the repo root).
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "Mooshieblob1"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
